# Dependabot config for qwen3-tts-webui.
#
# Two ecosystems configured: npm for the frontend (Dependabot's npm ecosystem reads
# pnpm-lock.yaml natively, so this stayed "npm" after the build moved to pnpm) and pip for
# the FastAPI backend, now that api/requirements.txt pins its versions instead of installing
# them inline in the Containerfile.
#
# No github-actions entry: there are no workflows in this repo yet.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Majors are left out of the group above deliberately, so a breaking change always
    # gets its own PR and review rather than riding in with routine bumps.

  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Same reasoning as the npm block above: majors get their own PR and review.
